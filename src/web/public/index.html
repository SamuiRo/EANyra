<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EANyra</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="off">
      <h1>EANyra</h1>
      <p id="login-hint" class="muted">Введіть майстер-пароль.</p>
      <label class="field">
        <span id="login-label">Майстер-пароль</span>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Увійти</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">EANyra <span id="version" class="muted"></span></div>
      <nav id="tabs" class="tabs" aria-label="Розділи">
        <button data-view="overview" class="active">Огляд</button>
        <button data-view="accounts">Акаунти</button>
        <button data-view="posts">Пости</button>
        <button data-view="signals">Сигнали</button>
        <button data-view="telegram">Telegram</button>
        <button data-view="jobs">Задачі</button>
      </nav>
      <button id="logout" class="ghost">Вийти</button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <dialog id="confirm" class="card">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body" class="preserve"></p>
    <div class="row end">
      <button id="confirm-cancel" class="ghost">Скасувати</button>
      <button id="confirm-ok" class="danger">Підтвердити</button>
    </div>
  </dialog>
</body>
</html>
