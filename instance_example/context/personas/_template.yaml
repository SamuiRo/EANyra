# Persona: one identity or theme across platforms (e.g. a business brand, an
# anime account). Each persona is self-contained: its own voice, bio and
# platform rules — nothing is shared between personas.
# The filename and slug must match. Accounts are assigned in the web UI
# («Акаунти» → edit → Персона); each account belongs to one persona only.

slug: "my-persona"           # lowercase kebab-case; must match my-persona.yaml
name: "Persona Name"

description: |
  Who this persona is, who it speaks to and what it posts about.

topics:
  - "Main topic"
  - "Secondary topic"

# "platform/username" from accounts.json (filled by the web UI).
accounts: []

# How this persona writes.
voice:
  tone: "Technical but not snobbish. Practical, not theoretical."
  likes:
    - "Specific numbers (5 minutes, 200 posts, 3 days)"
    - "Behind the scenes thoughts — what worked and why"
  dislikes:
    - "Corporate clichés and marketing language"
  example_post: |

  taboo:
    - "Never publish unverified facts as facts"
    - "Never ask for likes / subscriptions explicitly"

# Profile bio per platform (short; full where the platform has one).
bio:
  twitter:
    short: ""
  telegram:
    short: ""
    full: ""

# Rules per platform this persona posts on.
platforms:
  twitter:
    max_length: 280          # free account limit; X Premium = 4000
    language: "uk"
    style: ""
    formats:
      - "insight"
      - "release"
    avoid:
      - "no specifics"
    posting_frequency: "2 posts per week"
  telegram:
    language: "uk"
    style: ""
    formats:
      - "short"
    posting_frequency: "weekly"

# Project slugs this persona talks about. Omit to use all active projects;
# [] means this persona never posts about the projects.
projects: []
